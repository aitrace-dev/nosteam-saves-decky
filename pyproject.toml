[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nosteam-client"
version = "0.4.1"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "vdf>=3.4,<4", "PyYAML>=6,<7", "PyJWT[crypto]>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
nosteam = "nosteam_client.cli:main"
nosteam-service = "nosteam_client.companion:main"

[tool.hatch.build.targets.wheel]
packages = ["nosteam_client"]
